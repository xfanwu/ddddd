name: test

# Runs every check on Linux: the bundled aria2 is compiled from the pinned
# source, then the engine smoke test, the UI flow test and the real-app
# end-to-end suite (Electron under a virtual display) all run against it.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libssl-dev xvfb

      - name: Bundle aria2
        run: npm run vendor

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Engine smoke test (real download through the bundled aria2)
        run: ARIA2C="$PWD/vendor/bin/aria2c" node scripts/smoke-engine.js

      - name: UI flow test
        run: npm run test:ui

      - name: Real-app end-to-end test
        run: xvfb-run -a npm run test:app
