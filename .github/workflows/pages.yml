name: pages

# Publishes the landing page (site/) to GitHub Pages at
# https://xfanwu.github.io/dung/. One-time setup: Settings -> Pages ->
# Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/beetle.gif'
      - 'docs/social-preview.png'
      - 'build/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp docs/beetle.gif docs/social-preview.png build/icon.png src/renderer/fonts/PixelifySans.woff2 _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
