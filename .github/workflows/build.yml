name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ship aria2 inside the app. macOS compiles the pinned source against
      # system libraries only (and fails if anything else gets linked);
      # Windows uses the pinned official build. The mac job also keeps the
      # source tarball, attached to the release to satisfy aria2's GPL.
      - name: Bundle aria2 (macOS)
        if: matrix.artifact == 'mac'
        run: node scripts/vendor-aria2.js --source

      - name: Bundle aria2 (Windows)
        if: matrix.artifact == 'win'
        run: node scripts/vendor-aria2.js

      - name: Smoke-test bundled aria2
        shell: bash
        run: |
          ls -la vendor/bin vendor/bin/licenses
          bin="$PWD/vendor/bin/aria2c"
          if [ -f "$bin.exe" ]; then bin="$(cygpath -w "$bin.exe")"; fi
          ARIA2C="$bin" node scripts/smoke-engine.js

      - name: Build (macOS)
        if: matrix.artifact == 'mac'
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build (Windows)
        if: matrix.artifact == 'win'
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dung-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/aria2-*.tar.xz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The release text is this version's section of CHANGELOG.md.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) found = 1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Dung $version" > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          # Descriptive titles read better in search results and feeds than "v1.6.0".
          name: Dung ${{ github.ref_name }} — paste a link, it downloads
          files: artifacts/**/*
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
